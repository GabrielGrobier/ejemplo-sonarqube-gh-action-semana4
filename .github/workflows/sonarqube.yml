name: Build y análisis SonarQube

on:
  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-sonar:

    name: Maven + SonarQube
    runs-on: ubuntu-latest

    steps:

      - name: Descargar código
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configurar Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verificar conexión con SonarQube
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          echo "Servidor SonarQube configurado"
          curl -f --connect-timeout 10 \
            "$SONAR_HOST_URL/api/system/status"

      - name: Compilar y probar aplicación
        run: |
          mvn -B clean verify

      - name: Analizar código con SonarQube
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          mvn -B \
            org.sonarsource.scanner.maven:sonar-maven-plugin:5.7.0.6970:sonar \
            -Dsonar.host.url="$SONAR_HOST_URL" \
            -Dsonar.token="$SONAR_TOKEN" \
            -Dsonar.projectKey=biblioteca-demo-github-actions \
            -Dsonar.projectName="Biblioteca Demo GitHub Actions"